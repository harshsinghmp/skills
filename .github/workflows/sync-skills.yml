name: Automated Upstream Skills Sync

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: "Optional name filter for specific skill(s) to sync"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstreams:
    name: Sync Upstream Repositories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run Upstream Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.filter }}" ]; then
            bun run sync -- --filter "${{ github.event.inputs.filter }}"
          else
            bun run sync
          fi

      - name: Validate Synced Skills
        run: bun run validate

      - name: Check for Changes
        id: git-diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with Upstream Updates
        if: steps.git-diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(skills): Sync latest updates from upstream repositories"
          branch: automated-upstream-sync
          title: "🤖 Automated Upstream Skills Synchronization"
          body: |
            ### 🔄 Automated Upstream Skill Updates
            This pull request was automatically generated by the **Automated Upstream Skills Sync** workflow.

            - Synced upstream changes according to `skills.manifest.json`.
            - Validated all YAML frontmatter headers and structure (`bun run validate`).
            - Provenance metadata updated in `.upstream-meta.json` files.

            #### 📋 Review Checklist:
            - [ ] Inspect diffs for unexpected prompt modifications or breaking changes.
            - [ ] Confirm all unit tests and CI checks pass.
            - [ ] Merge into `main` to publish updates to `npx skills add harshsinghmp/skills`.
          labels: |
            skills-sync
            automated-pr
          delete-branch: true
