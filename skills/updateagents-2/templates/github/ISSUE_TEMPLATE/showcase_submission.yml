name: Showcase submission
description: Share a project, feature, or result built with this repository.
title: "[Showcase] "
labels: ["showcase"]
body:
  - type: input
    id: project_name
    attributes:
      label: Project name
      placeholder: Name of the project or result
    validations:
      required: true
  - type: input
    id: project_url
    attributes:
      label: Public link
      description: Link to a public page, repository, demo, or other shareable artifact.
      placeholder: https://example.com
    validations:
      required: false
  - type: textarea
    id: work_summary
    attributes:
      label: What did you build or contribute?
      description: Include the relevant stack, tools, or project areas.
    validations:
      required: true
  - type: checkboxes
    id: permission
    attributes:
      label: Sharing permission
      options:
        - label: The project maintainers may feature this submission publicly.
          required: false
