name: CLI Test Matrix

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
{{NODE_SETUP}}
      - name: Install dependencies
        run: {{NODE_INSTALL}}
{{NODE_CHECKS}}
