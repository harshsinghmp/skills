name: qa-launch
description: "Pre-launch quality gate: cross-browser and device matrix planning, critical-path functional verification, front-end performance checklist (HTML/CSS/fonts/images/JS/server budgets), Core Web Vitals audit and production gate (sub-200ms INP, zero-CLS fences, sub-2.5s LCP, zero-FOUC web font budget), release-gate checklist with Block-or-Ship verdict, post-fix regression, and Playwright synthetic user journey smoke suites — routed through eight modes. Use when asked to QA a site before launch, verify a release candidate, run the front-end performance checklist, audit Core Web Vitals (INP/CLS/LCP/fonts), plan browser and device coverage, run headless Playwright smoke tests, or re-verify after fixes. Not for fixing code (webdev), auditing UI visuals (refactor-ui), or deploying (devops)."
